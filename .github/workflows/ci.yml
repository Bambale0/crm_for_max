name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci -d crm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.11-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://crm_ci:disposable_ci_password@127.0.0.1:5432/crm_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://crm_ci:disposable_ci_password@127.0.0.1:5432/crm_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
      - name: Install uv
        run: python -m pip install uv==0.12.13
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Check types
        run: uv run --frozen mypy app
      - name: Apply test database migrations
        run: uv run --frozen alembic upgrade head
      - name: Check migration matches models
        run: uv run --frozen alembic check
      - name: Run unit and integration tests
        run: uv run --frozen pytest
      - name: Validate local Compose configuration
        env:
          POSTGRES_PASSWORD: disposable_compose_check
        run: docker compose config --quiet
      - name: Build application image
        run: docker build --tag crm-for-max:ci .
