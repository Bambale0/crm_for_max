# Local development only. Apply migrations explicitly before starting the API.
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-bookworm
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment: &app-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-crm}
      REDIS_URL: redis://redis:6379/0
      MAX_STAFF_TOKEN: ${MAX_STAFF_TOKEN:-}
      MAX_OBSERVER_TOKEN: ${MAX_OBSERVER_TOKEN:-}
      MAX_STAFF_WEBHOOK_SECRET: ${MAX_STAFF_WEBHOOK_SECRET:-}
      MAX_OBSERVER_WEBHOOK_SECRET: ${MAX_OBSERVER_WEBHOOK_SECRET:-}
      MAX_BOT_ORGANIZATION_ID: ${MAX_BOT_ORGANIZATION_ID:-}
      MAX_TIMEOUT_SECONDS: ${MAX_TIMEOUT_SECONDS:-10}
      MAX_OWNER_IDS: ${MAX_OWNER_IDS:-}
      MAX_OPERATOR_IDS: ${MAX_OPERATOR_IDS:-}
      MAX_EMPLOYEE_IDS: ${MAX_EMPLOYEE_IDS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-120}
      DEEPSEEK_MIN_CONFIDENCE: ${DEEPSEEK_MIN_CONFIDENCE:-0.72}
      MAX_INIT_DATA_TTL_SECONDS: ${MAX_INIT_DATA_TTL_SECONDS:-300}
      MAX_INIT_DATA_FUTURE_SKEW_SECONDS: ${MAX_INIT_DATA_FUTURE_SKEW_SECONDS:-30}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  bot-worker:
    profiles: [bot]
    build: .
    command: ["python", "-m", "app.bot.worker"]
    environment: *app-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  chat-analyzer:
    profiles: [bot]
    build: .
    command: ["python", "-m", "app.bot.chat_analyzer"]
    environment: *app-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres-test:
    profiles: [test]
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_DB: crm_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis-test:
    profiles: [test]
    image: redis:7.4.11-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-16379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
