[project]
name = "crm-for-max"
version = "0.1.0"
description = "Единая цифровая диспетчерская управляющей компании"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires disposable TEST_DATABASE_URL and TEST_REDIS_URL"]
